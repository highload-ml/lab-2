name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and run tests
        run: ./gradlew clean check jacocoTestReport --no-daemon

      - name: Build and start microservices
        run: docker compose --env-file .env.example up --build --wait --wait-timeout 240

      - name: Verify discovery, config and public API
        run: python3 scripts/smoke.py

      - name: Verify tracking lifecycle and atomic batch writes
        run: python3 scripts/tracking-smoke.py

      - name: Collect container logs
        if: always()
        run: docker compose --env-file .env.example logs --no-color > compose.log

      - name: Stop microservices
        if: always()
        run: docker compose --env-file .env.example down --volumes

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
            compose.log
          if-no-files-found: warn
          retention-days: 14
