databaseChangeLog:
  - changeSet:
      id: 004-create-experiments
      author: developer-2
      changes:
        - createTable:
            tableName: experiments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_experiments
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: experiments
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_experiments_project
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: experiments
            columnNames: project_id, name
            constraintName: uk_experiments_project_name
        - createIndex:
            tableName: experiments
            indexName: ix_experiments_project_created_id
            columns:
              - column:
                  name: project_id
              - column:
                  name: created_at
              - column:
                  name: id
      rollback:
        - dropTable:
            tableName: experiments
