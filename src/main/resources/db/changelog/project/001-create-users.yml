databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: developer-1
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: nickname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: users
            columnNames: nickname
            constraintName: uk_users_nickname
        - sql:
            sql: >
              ALTER TABLE users ADD CONSTRAINT ck_users_role
              CHECK (role IN ('ADMIN', 'ML_ENGINEER', 'REVIEWER'))
      rollback:
        - dropTable:
            tableName: users
  - changeSet:
      id: 001-index-users-created-at
      author: developer-1
      comment: supports GET /api/v1/users ordered by (created_at, id) without a full-table sort
      changes:
        - createIndex:
            tableName: users
            indexName: ix_users_created_at_id
            columns:
              - column:
                  name: created_at
              - column:
                  name: id
