databaseChangeLog:
  - changeSet:
      id: 203-create-artifacts
      author: developer-2
      changes:
        - createTable:
            tableName: artifacts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_artifacts
                    nullable: false
              - column:
                  name: run_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: path
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: artifacts
            baseColumnNames: run_id
            referencedTableName: runs
            referencedColumnNames: id
            constraintName: fk_artifacts_run
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: artifacts
            columnNames: run_id, name
            constraintName: uk_artifacts_run_name
        - createIndex:
            tableName: artifacts
            indexName: ix_artifacts_run_created_id
            columns:
              - column:
                  name: run_id
              - column:
                  name: created_at
              - column:
                  name: id
        - sql:
            sql: >
              ALTER TABLE artifacts ADD CONSTRAINT ck_artifacts_type
              CHECK (type IN ('MODEL', 'IMAGE', 'DATASET', 'LOG', 'OTHER'))
        - sql:
            sql: >
              ALTER TABLE artifacts ADD CONSTRAINT ck_artifacts_size_nonnegative
              CHECK (size_bytes >= 0)
      rollback:
        - dropTable:
            tableName: artifacts
