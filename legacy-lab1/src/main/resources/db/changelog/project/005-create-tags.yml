databaseChangeLog:
  - changeSet:
      id: 005-create-tags
      author: developer-2
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tags
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: tags
            columnNames: name
            constraintName: uk_tags_name
        - createTable:
            tableName: experiment_tags
            columns:
              - column:
                  name: experiment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: experiment_tags
            columnNames: experiment_id, tag_id
            constraintName: pk_experiment_tags
        - addForeignKeyConstraint:
            baseTableName: experiment_tags
            baseColumnNames: experiment_id
            referencedTableName: experiments
            referencedColumnNames: id
            constraintName: fk_experiment_tags_experiment
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: experiment_tags
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_experiment_tags_tag
            onDelete: CASCADE
        - createIndex:
            tableName: experiment_tags
            indexName: ix_experiment_tags_tag_id
            columns:
              - column:
                  name: tag_id
      rollback:
        - dropTable:
            tableName: experiment_tags
        - dropTable:
            tableName: tags
