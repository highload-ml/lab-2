databaseChangeLog:
  - changeSet:
      id: 002-create-projects
      author: developer-1
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_projects
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: projects
            columnNames: name
            constraintName: uk_projects_name
        # supports GET /api/v1/projects ordered by (created_at, id) without a full-table sort
        - createIndex:
            tableName: projects
            indexName: ix_projects_created_at_id
            columns:
              - column:
                  name: created_at
              - column:
                  name: id
      rollback:
        - dropTable:
            tableName: projects
