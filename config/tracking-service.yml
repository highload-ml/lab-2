server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
# Runtime queries use R2DBC; Liquibase migrations use a separate JDBC connection.
spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracking}
    username: ${DB_USERNAME:tracking}
    password: ${DB_PASSWORD}
  liquibase:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracking}
    user: ${DB_USERNAME:tracking}
    password: ${DB_PASSWORD}
    change-log: classpath:/db/changelog/db.changelog-master.yml
app:
  pagination:
    max-page-size: ${MAX_PAGE_SIZE:50}
springdoc:
  paths-to-match: /api/v1/**
