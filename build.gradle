plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    springCloudVersion = '2025.1.3'
    springdocVersion = '3.1.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    group = 'ru.itmo'
    version = '0.0.1-SNAPSHOT'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }
    dependencyManagement {
        imports { mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}" }
    }
    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }
    tasks.named('test') { useJUnitPlatform { excludeTags 'integration' } }
    tasks.register('integrationTest', Test) {
        description = 'Runs database integration tests (requires Docker).'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'integration' }
        shouldRunAfter tasks.named('test')
    }
    tasks.named('bootJar') { archiveFileName = 'app.jar' }
    tasks.named('jar') { enabled = false }
    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test'), tasks.named('integrationTest')
        executionData(fileTree(layout.buildDirectory).include('jacoco/*.exec'))
        reports { xml.required = true; html.required = true }
    }
    tasks.named('check') { dependsOn tasks.named('integrationTest') }
}

tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('bootJar') } }
